<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RTS — Acompanhar entrega</title>
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f4f6}
#map{position:fixed;inset:0}.top{position:fixed;z-index:1000;top:10px;left:10px;right:10px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 20px #0002}
.title{font-size:18px;font-weight:800}.sub{font-size:13px;color:#555;margin-top:4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.stat{background:#f3f4f6;border-radius:12px;padding:9px}.stat b{display:block;font-size:17px;margin-top:2px}
.last-update{margin-top:9px;border:2px solid #e5e7eb;border-radius:13px;padding:10px;background:#fff}.last-update .label{font-size:11px;color:#666;font-weight:700}.last-update .time{font-size:20px;font-weight:900;margin-top:2px}.last-update.stale .time{color:#dc2626}.last-update.fresh .time{color:#16a34a}
.bottom{position:fixed;z-index:1000;left:10px;right:10px;bottom:10px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 20px #0002}
.status{font-weight:800}.ok{color:#16a34a}.bad{color:#dc2626}.warn{color:#d97706}.small{font-size:12px;color:#666;margin-top:5px}.contact{width:100%;margin-top:9px;border:0;border-radius:12px;padding:12px;font-weight:800;background:#25D366;color:#071b0d;cursor:pointer}
.pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 7px #0005;font-weight:800}.driver{background:#111827;color:white}.dest{background:#facc15;color:#111}
@media(min-width:760px){.top,.bottom{width:430px;left:20px;right:auto}}
</style>
<script>
window.GOOGLE_MAPS_API_KEY="AIzaSyAi9djViYnxldRRyNlRXlUaPe1fW_uEPN8";
</script>
<script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAi9djViYnxldRRyNlRXlUaPe1fW_uEPN8&libraries=places,geometry&loading=async&callback=initGoogleMap"></script>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
  <div class="title">RTS — Acompanhe sua entrega</div>
  <button id="centerDriverClient" style="border:0;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer;margin-right:6px">🏍️ CENTRALIZAR</button>
  <button id="refreshClient" style="border:0;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer">🔄 ATUALIZAR</button>
</div>
  <div id="headline" class="sub">Carregando informações...</div>
  <div class="stats">
    <div class="stat"><span>📦 Entregas antes da sua</span><b id="ahead">--</b></div>
    <div class="stat"><span>⏱️ Previsão aproximada</span><b id="eta">--</b></div>
  </div>
  <div id="lastUpdateCard" class="last-update">
    <div class="label">📍 ÚLTIMA ATUALIZAÇÃO DO MOTOBOY</div>
    <div id="lastUpdateBig" class="time">Localização Atualizada --:--</div>
  </div>
</div>
<div class="bottom">
  <div id="status" class="status warn">🟡 Entrega pendente</div>
  <div id="detail" class="small">A localização é atualizada aproximadamente a cada 1 minuto.</div>
  <button id="talkDriver" class="contact" style="display:none">💬 FALAR COM O MOTOQUEIRO</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="shared.js"></script>
<script>
let map;
function initGoogleMap(){
  map=new google.maps.Map(document.getElementById("map"),{center:{lat:-9.6498,lng:-35.7089},zoom:13,mapTypeControl:true,streetViewControl:false,fullscreenControl:true});
  refresh();
}
const sb=getSupabaseClient();
const token=new URLSearchParams(location.search).get("t");
let driverMarker=null,destMarker=null,lastDriverPosition=null;
const icon=(kind,label)=>({kind,label});

function closeTracking(d){
  document.getElementById("talkDriver").style.display="none";
  if(driverMarker){driverMarker.setMap(null);driverMarker=null}
  document.getElementById("ahead").textContent="—";
  document.getElementById("eta").textContent="—";

  const card=document.getElementById("lastUpdateCard");
  const big=document.getElementById("lastUpdateBig");

  if(d.status==="done"){
    document.getElementById("status").className="status ok";
    document.getElementById("status").textContent="✅ Entrega realizada";
    document.getElementById("headline").textContent="Sua entrega foi concluída.";
    card.className="last-update fresh";
    big.textContent=`${d.client_name||"Cliente"}, sua entrega já foi recolhida`;
    document.getElementById("detail").textContent=`O rastreamento da localização do motoboy foi encerrado.${d.completed_at?" Conclusão: "+new Date(d.completed_at).toLocaleString("pt-BR"):""}`;
  }else{
    document.getElementById("status").className="status bad";
    document.getElementById("status").textContent="❌ Entrega não realizada";
    document.getElementById("headline").textContent="A entrega foi encerrada.";
    card.className="last-update stale";
    big.textContent="Entrega não realizada";
    document.getElementById("detail").textContent=`O rastreamento da localização do motoboy foi encerrado.${d.completed_at?" Conclusão: "+new Date(d.completed_at).toLocaleString("pt-BR"):""}`;
  }
}
async function estimate(d,drv){
  const {data:pending}=await sb.from("deliveries").select("id,lat,lng,route_order,status,driver_id")
    .eq("driver_id",d.driver_id).eq("status","pending").order("route_order",{ascending:true});
  const ordered=(pending||[]).filter(x=>x.route_order!=null).sort((a,b)=>a.route_order-b.route_order);
  const pos=ordered.findIndex(x=>x.id===d.id);
  const ahead=pos<0?0:pos;
  document.getElementById("ahead").textContent=ahead===0?"Você é o próximo":String(ahead);

  if(ahead>0){
    document.getElementById("eta").textContent="Aguardando sua vez";
    return;
  }

  if(!drv||drv.lat==null){
    document.getElementById("eta").textContent="Calculando...";
    return;
  }

  try{
    const url=`https://router.project-osrm.org/route/v1/driving/${drv.lng},${drv.lat};${d.lng},${d.lat}?overview=false`;
    const r=await fetch(url);
    const j=await r.json();
    if(j.code!=="Ok"||!j.routes?.length)throw 0;
    const mins=Math.max(1,Math.round(j.routes[0].duration/60));
    document.getElementById("eta").textContent=`~${mins} min`;
  }catch(e){
    document.getElementById("eta").textContent="Indisponível";
  }
}
async function refresh(){
  if(!sb||!token){document.getElementById("headline").textContent="Link de rastreamento inválido.";return}
  const {data,error}=await sb.from("deliveries").select("*").eq("tracking_token",token).is("deleted_at",null).limit(1);
  if(error||!data||!data.length){
    document.getElementById("headline").textContent="Este link não é válido ou expirou.";
    document.getElementById("status").textContent="Rastreamento indisponível";
    document.getElementById("ahead").textContent="—";document.getElementById("eta").textContent="—";return
  }
  const d=data[0];
  if(d.status==="awaiting_collection"){
    if(driverMarker){driverMarker.setMap(null);driverMarker=null}
    if(destMarker){destMarker.setMap(null);destMarker=null}
    document.getElementById("headline").textContent="Seu pedido ainda está aguardando coleta.";
    document.getElementById("status").className="status warn";
    document.getElementById("status").textContent="⚪ Aguardando coleta";
    document.getElementById("ahead").textContent="—";
    document.getElementById("eta").textContent="Aguardando coleta";
    document.getElementById("talkDriver").style.display="none";
    document.getElementById("lastUpdateBig").textContent="Motoqueiro ainda não definido";
    document.getElementById("detail").textContent="O rastreamento será liberado quando um motoqueiro coletar sua entrega.";
    return;
  }
  if(!destMarker)destMarker=new google.maps.Marker({position:{lat:Number(d.lat),lng:Number(d.lng)},map,label:"📦",title:"Sua entrega"});
  if(d.status!=="pending"){closeTracking(d);map.setCenter({lat:Number(d.lat),lng:Number(d.lng)});map.setZoom(16);return}
  document.getElementById("status").className="status warn";
  document.getElementById("status").textContent="🟡 Entrega pendente";
  document.getElementById("headline").textContent=d.route_order===1?"🏍️ Você é a próxima entrega":(d.route_order?`Sua entrega está na posição ${d.route_order} da rota.`:"Seu pedido está na rota do motoboy.");
  const {data:drivers}=await sb.from("drivers").select("id,name,lat,lng,last_seen,is_online").eq("id",d.driver_id).limit(1);
  const drv=drivers&&drivers[0];
  const talk=document.getElementById("talkDriver");
  if(drv&&drv.phone){
    talk.style.display="block";
    talk.onclick=()=>openWhatsApp(drv.phone);
  }else talk.style.display="none";
  if(drv&&drv.lat!=null){
    const pos={lat:Number(drv.lat),lng:Number(drv.lng)};
    if(!driverMarker)driverMarker=new google.maps.Marker({position:pos,map,label:"🏍️",title:"Motoboy"});
    else driverMarker.setPosition(pos);
    const bounds=new google.maps.LatLngBounds(); bounds.extend({lat:Number(d.lat),lng:Number(d.lng)}); bounds.extend(pos); map.fitBounds(bounds,55);
    const last=drv.last_seen?new Date(drv.last_seen):null;
    const lastText=last?last.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"--:--";
    const fresh=last && Date.now()-last.getTime()<180000;
    const card=document.getElementById("lastUpdateCard");
    card.className="last-update "+(fresh?"fresh":"stale");
    document.getElementById("lastUpdateBig").textContent=`Localização Atualizada ${lastText}`;
    document.getElementById("detail").textContent=fresh?"A localização do motoboy é atualizada aproximadamente a cada 1 minuto.":"⚠️ A localização do motoboy está há mais de 3 minutos sem atualização.";
  }
  await estimate(d,drv);
}


document.getElementById("centerDriverClient").onclick=()=>{
  if(!lastDriverPosition)return alert("A localização do motoboy ainda não está disponível.");
  map.setCenter(lastDriverPosition);
  map.setZoom(17);
  if(driverMarker)driverMarker.setMap(map);
};

document.getElementById("refreshClient").onclick=async()=>{
  const btn=document.getElementById("refreshClient");
  const old=btn.textContent; btn.disabled=true; btn.textContent="⏳";
  try{await refresh();}
  finally{btn.disabled=false; btn.textContent=old;}
};

if(sb){
  sb.channel("cliente-"+(token||"x"))
    .on("postgres_changes",{event:"*",schema:"public",table:"deliveries"},()=>refresh())
    .on("postgres_changes",{event:"*",schema:"public",table:"drivers"},()=>refresh())
    .subscribe();
}
setInterval(refresh,60000);
</script></body></html>
