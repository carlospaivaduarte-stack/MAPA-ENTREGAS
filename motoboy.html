<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RTS — Motoboy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}#map{position:fixed;inset:0}
.top{position:fixed;z-index:1000;top:10px;left:10px;right:10px;background:#fff;padding:10px;border-radius:14px;box-shadow:0 3px 18px #0002}
.panel{position:fixed;z-index:1000;left:10px;right:10px;bottom:10px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 5px 25px #0003;max-height:58vh;overflow:auto}.panel.collapsed #deliveries,.panel.collapsed .delivery-help{display:none}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;margin-bottom:7px}
button{border:0;border-radius:11px;padding:11px;font-weight:700;cursor:pointer}.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}.wa{background:#25D366;color:#071b0d}.gray{background:#eee}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.delivery{border-top:1px solid #eee;padding:9px 0}.small{font-size:12px;color:#666}.status{font-size:12px;font-weight:bold;margin:3px 0}
.num-pin{width:30px;height:30px;border-radius:50%;background:#facc15;border:2px solid white;box-shadow:0 1px 5px #0005;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:7px 0}.metric{background:#f3f4f6;border-radius:9px;padding:6px;text-align:center;font-size:10px}.metric b{display:block;font-size:15px}
.route-times{font-size:11px;color:#555;background:#f8fafc;border-radius:10px;padding:7px;margin:6px 0}
</style></head><body>
<div id="map"></div>
<div class="top"><b>🏍️ RTS — Motoboy</b> · <span id="state">desconectado</span></div>
<div class="panel">
<input id="driverName" placeholder="Seu nome">
<input id="driverPhone" inputmode="tel" placeholder="Seu telefone">
<div class="row"><button class="blue" id="start">📍 Iniciar rastreamento</button><button class="gray" id="stop">⏹ Parar</button></div>
<div class="row" style="margin-top:6px"><button class="green" id="startRoute">▶️ INICIAR ROTA</button><button class="gray" id="routeTimes">🕐 Horários</button></div>
<div id="routeTimeInfo" class="route-times" style="display:none">Saída: -- · Início da rota: -- · Conclusão: --</div>
<div class="metrics">
  <div class="metric">Total<b id="mTotal">0</b></div>
  <div class="metric">Pend.<b id="mPending">0</b></div>
  <div class="metric">Entreg.<b id="mDone">0</b></div>
  <div class="metric">Não ent.<b id="mFailed">0</b></div>
</div>
<div class="small delivery-help" style="margin:7px 0">Sua localização será enviada à central aproximadamente a cada 60 segundos enquanto esta página estiver aberta e o GPS ativo.</div>
<div class="row" style="margin-bottom:7px">
<button class="blue" id="centerMe">📍 Centralizar em mim</button>
<button class="gray" id="toggleDeliveries">⬇️ Minimizar entregas</button>
</div>
<div class="row" style="margin-bottom:7px">
<button class="blue" id="organizeRoute">🧠 ORGANIZAR ROTA</button>
<button class="gray" id="openRoute">🗺️ ABRIR ROTA</button>
</div>
<div id="routeInfo" class="small" style="margin:5px 0">A rota usa somente suas entregas coletadas e pendentes.</div>
<div id="deliveries"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="shared.js"></script>
<script>
const map=L.map("map").setView([-9.6658,-35.7353],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let currentDriver=null,currentDeliveries=[],deliveryMarkers={},sb=null,watch=null,marker=null,lastPosition=null,hasCentered=false,driverId=localStorage.getItem("v7_driver_id")||crypto.randomUUID(),lastSend=0;
localStorage.setItem("v7_driver_id",driverId);
document.getElementById("driverName").value=localStorage.getItem("v7_driver_name")||"";
document.getElementById("driverPhone").value=localStorage.getItem("v7_driver_phone")||"";

async function upsertDriver(pos){
  const now=Date.now(); lastPosition=pos; if(now-lastSend<60000 && marker)return; lastSend=now;
  const name=document.getElementById("driverName").value.trim()||"Motoboy";
  const phone=document.getElementById("driverPhone").value.trim();
  localStorage.setItem("v7_driver_name",name);localStorage.setItem("v7_driver_phone",phone);
  const nowIso=new Date().toISOString();
  const row={id:driverId,name,phone,lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,is_online:true,last_seen:nowIso};
  if(!currentDriver?.is_online)row.tracking_started_at=nowIso;
  const {error}=await sb.from("drivers").upsert(row,{onConflict:"id"});
  if(error){console.error(error);document.getElementById("state").textContent="erro ao enviar localização";return}
  document.getElementById("state").textContent="🟢 online";
  currentDriver={...(currentDriver||{}),...row};
  renderRouteTimes();
  const ll=[row.lat,row.lng];
  if(!marker)marker=L.marker(ll).addTo(map).bindPopup("📍 Você");else marker.setLatLng(ll);
  if(!hasCentered){map.setView(ll,17);hasCentered=true;}
}
async function loadDeliveries(){
  if(!sb)return;
  const {data:assigned,error}=await sb.from("deliveries").select("*").eq("driver_id",driverId).order("created_at",{ascending:true});
  if(error){console.error(error);return}
  const {data:waiting,error:waitingError}=await sb.from("deliveries").select("*").eq("status","awaiting_collection").is("driver_id",null).order("created_at",{ascending:true});
  if(waitingError){console.error(waitingError);return}
  renderCollection(waiting||[]);
  renderDeliveries((assigned||[]).filter(d=>d.status!=="awaiting_collection"));
}

function renderCollection(data){
  const box=document.getElementById("collectionBox");
  if(!box)return;
  box.innerHTML=data.length?`<div style="border:2px solid #d1d5db;border-radius:12px;padding:9px;background:#fafafa">
    <b>⚪ ENTREGAS PARA COLETAR (${data.length})</b>
    ${data.map(d=>`<div class="delivery" style="margin-top:7px">
      <b>${esc(d.client_name)}</b>
      <div class="small">${esc(d.client_phone||"")}<br>${d.lat}, ${d.lng}</div>
      <button class="green" style="width:100%;margin-top:6px" onclick="collectDelivery('${d.id}')">✅ COLETADA</button>
    </div>`).join("")}
  </div>`:"";
}
window.collectDelivery=async id=>{
  if(!sb)return alert("Inicie o rastreamento primeiro.");
  const nowIso=new Date().toISOString();
  // A coleta só funciona se a entrega ainda estiver aguardando e sem motoqueiro.
  const {data,error}=await sb.from("deliveries")
    .update({driver_id:driverId,status:"pending",collected_at:nowIso,updated_at:nowIso})
    .eq("id",id)
    .eq("status","awaiting_collection")
    .is("driver_id",null)
    .select("id");
  if(error)return alert("Erro ao coletar: "+error.message);
  if(!data||!data.length){
    alert("Essa entrega já foi coletada por outro motoqueiro.");
    return loadDeliveries();
  }
  await loadDeliveries();
};

function renderDeliveries(data){
  currentDeliveries=data||[];
  document.getElementById("mTotal").textContent=currentDeliveries.length;
  document.getElementById("mPending").textContent=currentDeliveries.filter(x=>x.status==="pending").length;
  document.getElementById("mDone").textContent=currentDeliveries.filter(x=>x.status==="done").length;
  document.getElementById("mFailed").textContent=currentDeliveries.filter(x=>x.status==="failed").length;
  Object.values(deliveryMarkers).forEach(m=>map.removeLayer(m)); deliveryMarkers={};
  const pending=[...data].filter(d=>d.status==="pending").sort((a,b)=>(a.route_order||999)-(b.route_order||999));
  pending.forEach((d,i)=>{
    const n=d.route_order||i+1;
    const icon=L.divIcon({className:"",html:`<div class="num-pin">${n}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    deliveryMarkers[d.id]=L.marker([d.lat,d.lng],{icon}).addTo(map).bindPopup(`<b>${n}. ${esc(d.client_name)}</b><br>PENDENTE`);
  });
  const box=document.getElementById("deliveries");
  box.innerHTML=data.length?data.map(d=>`<div class="delivery"><b>${d.route_order?d.route_order+'. ':''}👤 ${esc(d.client_name)}</b><br>
    <span onclick="openWhatsApp('${esc(d.client_phone)}')" style="color:#128c45;text-decoration:underline;cursor:pointer">📱 ${esc(d.client_phone||"")}</span>
    <div class="status">${d.status==="done"?"✅ ENTREGUE":d.status==="failed"?"❌ NÃO ENTREGUE":"🟡 PENDENTE"}</div>
    <div class="small">${d.lat}, ${d.lng}${d.status!=="pending"?`<br>🕐 ${new Date(d.completed_at||d.updated_at).toLocaleString("pt-BR")}`:""}${d.note?`<br>📝 ${esc(d.note)}`:""}</div>
    <div class="row" style="margin-top:6px">
      <button class="wa" onclick="openWhatsApp('${esc(d.client_phone)}')">💬 WhatsApp</button>
      <button class="wa" onclick="sendTracking('${d.id}')">📍 Enviar rastreamento</button>
      <button class="blue" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&travelmode=driving','_blank')">🧭 Navegar</button>
      ${d.status==="pending"?`<button class="green" onclick="setStatus('${d.id}','done')">✅ Entregue</button><button class="red" onclick="setStatus('${d.id}','failed')">❌ Não entregue</button>`:""}
    </div></div>`).join(""):"<div class='small'>Nenhuma entrega atribuída.</div>";
}

function trackingUrl(d){
  return `${location.origin}${location.pathname.replace(/motoboy\.html$/,"")}acompanhar.html?t=${encodeURIComponent(d.tracking_token||"")}`;
}
window.sendTracking=id=>{
  const d=currentDeliveries.find(x=>x.id===id);
  if(!d||!d.tracking_token)return alert("Esta entrega ainda não possui link de rastreamento.");
  const n=normalizePhone(d.client_phone);
  if(n.length<12)return alert("Confira o telefone do cliente e inclua o DDD.");
  const msg=`Acompanhe o nosso motoboy com Esse Link de rastreamento:\n${trackingUrl(d)}`;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,"_blank");
};

async function setStatus(id,status){
  let note="";
  if(status==="failed"){
    const choice=prompt("Motivo da não entrega:\n1 - Cliente ausente\n2 - Endereço não localizado\n3 - Cliente recusou\n4 - Outro");
    if(choice===null)return;
    if(choice==="1")note="Cliente ausente";
    else if(choice==="2")note="Endereço não localizado";
    else if(choice==="3")note="Cliente recusou";
    else if(choice==="4")note=prompt("Digite o motivo:")||"Outro";
    else note=choice||"Não informado";
  }
  const nowIso=new Date().toISOString();
  const {error}=await sb.from("deliveries").update({status,note,completed_at:nowIso,updated_at:nowIso}).eq("id",id);
  if(error)return alert("Erro ao atualizar entrega: "+error.message);
  const {data:remaining}=await sb.from("deliveries").select("id").eq("driver_id",driverId).eq("status","pending").limit(1);
  if(!remaining||remaining.length===0){
    await sb.from("drivers").update({route_finished_at:nowIso}).eq("id",driverId);
    if(currentDriver)currentDriver.route_finished_at=nowIso;
    renderRouteTimes();
  }
  loadDeliveries();
}

function ft(v){return v?new Date(v).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"--"}
function renderRouteTimes(){
  document.getElementById("routeTimeInfo").textContent=`Saída / GPS: ${ft(currentDriver?.tracking_started_at)} · Início da rota: ${ft(currentDriver?.route_started_at)} · Conclusão: ${ft(currentDriver?.route_finished_at)}`;
}
async function loadDriverInfo(){
  if(!sb)return;
  const {data}=await sb.from("drivers").select("*").eq("id",driverId).limit(1);
  currentDriver=data&&data[0]?data[0]:null;
  renderRouteTimes();
}
document.getElementById("routeTimes").onclick=()=>{
  const e=document.getElementById("routeTimeInfo");
  e.style.display=e.style.display==="none"?"block":"none";
};
document.getElementById("startRoute").onclick=async()=>{
  if(!sb)return alert("Inicie o rastreamento primeiro.");
  const nowIso=new Date().toISOString();
  const {error}=await sb.from("drivers").update({route_started_at:nowIso,route_finished_at:null}).eq("id",driverId);
  if(error)return alert("Erro ao iniciar rota: "+error.message);
  currentDriver={...(currentDriver||{}),route_started_at:nowIso,route_finished_at:null};
  renderRouteTimes();
  document.getElementById("routeTimeInfo").style.display="block";
  alert("Rota iniciada. O horário foi enviado para a Central.");
};


function km(a,b){
  const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
async function organizeMyRoute(){
  if(!sb)return alert("Inicie o rastreamento primeiro.");
  if(!lastPosition)return alert("Aguarde o GPS localizar você.");
  let pending=currentDeliveries.filter(d=>d.status==="pending"&&d.driver_id===driverId);
  if(!pending.length)return alert("Você não possui entregas pendentes.");
  let cur={lat:lastPosition.coords.latitude,lng:lastPosition.coords.longitude},ordered=[];
  while(pending.length){
    let best=0,bd=Infinity;
    pending.forEach((d,i)=>{const z=km(cur,d);if(z<bd){bd=z;best=i}});
    const next=pending.splice(best,1)[0];
    ordered.push(next);cur=next;
  }
  document.getElementById("routeInfo").textContent="Organizando rota...";
  for(let i=0;i<ordered.length;i++){
    const {error}=await sb.from("deliveries")
      .update({route_order:i+1,updated_at:new Date().toISOString()})
      .eq("id",ordered[i].id)
      .eq("driver_id",driverId)
      .eq("status","pending");
    if(error){
      document.getElementById("routeInfo").textContent="Erro ao organizar.";
      return alert("Erro ao organizar rota: "+error.message);
    }
  }
  document.getElementById("routeInfo").textContent=`Rota organizada com ${ordered.length} entrega(s).`;
  await loadDeliveries();
}
function openMyRoute(){
  if(!lastPosition)return alert("Aguarde o GPS localizar você.");
  const list=currentDeliveries
    .filter(d=>d.status==="pending"&&d.driver_id===driverId)
    .sort((a,b)=>(a.route_order||999)-(b.route_order||999));
  if(!list.length)return alert("Organize uma rota primeiro.");
  const block=list.slice(0,10);
  const dest=block[block.length-1];
  const ways=block.slice(0,-1);
  let u=`https://www.google.com/maps/dir/?api=1&origin=${lastPosition.coords.latitude},${lastPosition.coords.longitude}&destination=${dest.lat},${dest.lng}&travelmode=driving`;
  if(ways.length)u+=`&waypoints=${ways.map(x=>x.lat+","+x.lng).join("%7C")}`;
  window.open(u,"_blank");
  if(list.length>10)alert(`A primeira rota abriu com 10 entregas. Restam ${list.length-10}. Após concluir algumas, organize/abra novamente.`);
}
document.getElementById("organizeRoute").onclick=organizeMyRoute;
document.getElementById("openRoute").onclick=openMyRoute;

document.getElementById("centerMe").onclick=()=>{
  if(!lastPosition)return alert("Inicie o rastreamento e aguarde a localização.");
  map.setView([lastPosition.coords.latitude,lastPosition.coords.longitude],17);
};
document.getElementById("toggleDeliveries").onclick=()=>{
  const panel=document.querySelector(".panel");
  const collapsed=panel.classList.toggle("collapsed");
  document.getElementById("toggleDeliveries").textContent=collapsed?"⬆️ Mostrar entregas":"⬇️ Minimizar entregas";
  setTimeout(()=>map.invalidateSize(),100);
};
document.getElementById("start").onclick=async()=>{
  sb=getSupabaseClient(); if(!sb)return;
  await loadDriverInfo();
  if(!navigator.geolocation)return alert("GPS não suportado.");
  navigator.geolocation.getCurrentPosition(upsertDriver,()=>alert("Permita acesso à localização."),{enableHighAccuracy:true,timeout:20000});
  if(watch===null)watch=navigator.geolocation.watchPosition(upsertDriver,()=>{},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  loadDeliveries();
  sb.channel("motoboy-deliveries-"+driverId).on("postgres_changes",{event:"*",schema:"public",table:"deliveries",filter:"driver_id=eq."+driverId},()=>loadDeliveries()).subscribe();
};
document.getElementById("stop").onclick=async()=>{
  if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}
  if(sb)await sb.from("drivers").update({is_online:false,last_seen:new Date().toISOString()}).eq("id",driverId);
  document.getElementById("state").textContent="🔴 offline";
};
window.addEventListener("beforeunload",()=>{ if(sb) sb.from("drivers").update({is_online:false,last_seen:new Date().toISOString()}).eq("id",driverId); });
</script></body></html>
